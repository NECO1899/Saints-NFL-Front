@if (esRutaLogin()) {
  <router-outlet></router-outlet>
} @else {
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      #drawer
      class="sidenav"
      fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false"
    >
      <mat-toolbar>Menu</mat-toolbar>
      <mat-nav-list>
        <a mat-list-item routerLink="/temporada">Temporada</a>
        <a mat-list-item routerLink="/detalletemporada">Detalle Temporada</a>
        <a mat-list-item routerLink="/temporada-plantilla">Temporada Plantilla</a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <mat-toolbar style="background-color: #3f51b5; color: white;">
        @if (isHandset$ | async) {
          <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
            <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
          </button>
        }
        <span>ProjectEsteban</span>
        <span style="flex: 1 1 auto;"></span>
        @if (authService.usuarioActual(); as usuario) {
          <span style="font-size: 0.85rem; margin-right: 12px;">Hola, {{ usuario.nombre }}</span>
          <button mat-button (click)="cerrarSesion()" style="color: white; border: 1px solid rgba(255,255,255,0.4);">
            Salir
          </button>
        }
      </mat-toolbar>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
